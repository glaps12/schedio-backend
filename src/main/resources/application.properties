spring.application.name=Schedio Backend
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/schedio}
spring.datasource.username=${DB_USERNAME:schedio}
spring.datasource.password=${DB_PASSWORD:schedio_local_password}

spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

schedio.auth.issuer=${JWT_ISSUER:https://api.schedio.local}
schedio.auth.jwt-secret=${JWT_SECRET}
schedio.auth.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
schedio.auth.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:P30D}
